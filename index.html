<style>
/* Layout: one screen behind the bar. HUD strip, canvas stage with the drinks shelf and counter, recipe rail, big brass tap button. Single dark pub look on purpose. */
:root{
  --bg:#1b110c;
  --panel:#26180f;
  --line:#4a2f1e;
  --brass:#e0a943;
  --cream:#f4e7c9;
  --muted:#b49a7b;
  --good:#8fd27a;
  --bad:#ef6b55;
  --display:'Rubik',system-ui,sans-serif;
  --fun:'Rubik Bubbles','Rubik',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse 90% 50% at 50% 0%,#3a2214 0%,rgba(27,17,12,0) 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 46px),var(--bg);color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.hud{background:linear-gradient(180deg,#2f1d12,#22160e);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:inset 0 1px 0 rgba(255,220,150,.08),0 4px 12px rgba(0,0,0,.3);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.shift{padding:5px 8px;border-radius:8px;background:#1b110a;border:1px solid #6b4728;box-shadow:inset 0 0 8px rgba(224,169,67,.15);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--brass);text-transform:uppercase}
.money{display:flex;flex-direction:column;gap:4px;min-width:0}
.money-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.money-row b{color:var(--cream);font-weight:700;display:inline-block}
.money-row b.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:var(--brass)}100%{transform:scale(1)}}
.bar{height:8px;border-radius:4px;background:#1b110a;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 5px,transparent 5px 10px),linear-gradient(90deg,#c27f22,#f5c96a);background-size:14px 14px,100% 100%;box-shadow:0 0 8px rgba(224,169,67,.55);transition:width .3s;animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:14px 0,0 0}}
.timer{font-family:var(--display);font-weight:800;font-size:20px}
.timer.low{color:var(--bad);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.strikes{display:flex;gap:5px;align-items:center}
.strikes span{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.strikes span.on{background:var(--bad);border-color:var(--bad);box-shadow:0 0 8px var(--bad)}
.combo b{color:var(--brass)}
.combo.hot{color:var(--brass);text-shadow:0 0 10px rgba(255,150,40,.8)}
#menuBtn{font:inherit;font-size:12px;font-weight:700;color:var(--cream);background:#24170e;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
#menuBtn i{display:grid;gap:2px}#menuBtn i b{display:block;width:12px;height:2px;border-radius:1px;background:var(--brass)}
#menuBtn:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px}
.logo .mug{font-size:44px;line-height:1;filter:drop-shadow(0 4px 10px rgba(224,169,67,.4));animation:bob 2.4s ease-in-out infinite}
.card .logo h1{font-family:var(--fun);font-weight:400;font-size:48px;letter-spacing:.03em;text-shadow:0 0 18px rgba(224,169,67,.35),0 3px 0 #6b4718}
.logo span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips span{font-size:12px;padding:5px 10px;border-radius:999px;background:#1b110a;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chips b{color:var(--cream)}
.vbtns{display:flex;flex-direction:column;gap:10px}
.vbtns .btn{flex:none;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{min-width:0}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:#2a1a10;border:1px solid var(--line)}
.set label{font-size:14px;display:flex;flex-direction:column;gap:2px}
.set label small{font-size:12px;color:var(--muted)}
.set input[type=range]{width:120px;accent-color:var(--brass)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:26px;border-radius:13px;background:#1b110a;border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw:checked{background:#6b4718;border-color:var(--brass)}
.sw:checked::after{transform:translateX(20px);background:var(--brass)}
.sw:focus-visible,.set input[type=range]:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #6a2a20;box-shadow:0 3px 0 #140c07}
.book{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow-y:auto;padding-right:2px}
.book details{border-radius:12px;background:#2a1a10;border:1px solid var(--line);padding:8px 10px}
.book summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;list-style:none}
.book summary::-webkit-details-marker{display:none}
.book summary canvas{width:36px;height:36px;flex:none}
.book summary small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.book ol{margin:8px 0 2px;padding-left:20px;font-size:13px;line-height:1.5}
.book .lock{opacity:.5}
body.nohints .hints,body.nohints .keys{display:none!important}

function update(dt) {

    if (mode === 'rush') { timeLeft += dt; rushTick(); }
    else {

    }
  }
  if (pouring && curStep) {
    const L = LIQ[curStep.liq];
    layers[layers.length - 1].a += L.rate * cfg.speed * dt;
    if (L.foam) foam = Math.min(L.foam * .4, foam + dt * .05);
    if (pourFilter) pourFilter.frequency.value = 350 + topNow() * 1500;
    if (mugGeom && Math.random() < .7) {

      burst(mugGeom.cx + rand(-4, 4), y, 1, {angle: -Math.PI / 2, spread: 1.1, speed: [40, 110], life: [.2, .4], size: [1.5, 3], color: L.foamColor || L.color});
    }
